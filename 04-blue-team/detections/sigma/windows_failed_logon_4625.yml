title: Windows Failed Logon - Event ID 4625
id: 7f8a8c41-1f2e-4f89-9b67-4625c0a1d001
status: experimental
description: Detects Windows Security Event ID 4625, indicating a failed logon attempt. Intended as a baseline detection for the homelab Blue Team.
author: Jeremy253058
date: 2026/09/25
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Users entering an incorrect password
  - Expired or invalid credentials
  - Misconfigured services or scheduled tasks
level: low
tags:
  - attack.credential_access
